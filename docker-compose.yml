services:
  # ── Backend FastAPI + YOLOv8 + EasyOCR ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jm-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Model YOLOv8 — mount dari host agar tidak perlu rebuild saat ganti model
      - ./backend/models:/app/models:ro
      # EasyOCR model cache — persisten agar tidak download ulang setiap restart
      - easyocr_cache:/root/.EasyOCR
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ── Frontend Next.js ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: jm-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy

  # ── Nginx Reverse Proxy (HTTPS) ──────────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: jm-nginx
    restart: unless-stopped
    ports:
      - "443:443"   # HTTPS (wajib untuk akses kamera di browser)
      - "8080:80"   # Fallback HTTP (akan di-redirect ke HTTPS)
    depends_on:
      - frontend
      - backend

volumes:
  easyocr_cache:
