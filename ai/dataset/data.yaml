# Dataset config untuk training YOLOv8
# Path relatif dari lokasi file ini (ai/dataset/data.yaml)
# Dataset asli berada di root project folder

train: ../../train/images
val:   ../../valid/images
test:  ../../test/images

nc: 5
names:
  - 'GOL I'    # Sedan / Jip / Pick-up / Bus (≤2 gandar, tinggi <1m dari tanah)
  - 'GOL II'   # Truk 2 Gandar
  - 'GOL III'  # Truk 3 Gandar
  - 'GOL IV'   # Truk 4 Gandar
  - 'GOL V'    # Truk 5 Gandar atau lebih

